name: NEET Channel Finder

on:
  schedule:
    - cron: "30 23 * * *"   # 23:30 UTC = 5:00 AM IST
  workflow_dispatch: {}       # lets you trigger manually from GitHub UI

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install telethon

      - name: Run finder
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: python finder.py

      - name: Persist state.json
        run: |
          git config user.name "neet-finder-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state.json"
          git push
